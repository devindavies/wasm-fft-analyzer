name: Release

# Push a tag matching the Cargo.toml version (e.g. `v0.9.0`) to release.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm trusted publishing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Verify tag matches Cargo.toml version
        run: |
          crate_version=$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$crate_version" != "$tag_version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${crate_version}" >&2
            exit 1
          fi

      - name: Test
        run: cargo test --all

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all -- -D warnings

      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - run: rustup target add wasm32-unknown-unknown

      - name: Build package
        run: wasm-pack build --release --target web --scope devinmdavies

      # wasm-bindgen's glue needs TextDecoder/TextEncoder at load, which
      # AudioWorklets lack. Guard it (no-op where the globals exist).
      - name: Patch glue for AudioWorklet
        run: |
          node --test scripts/patch-glue.test.mjs
          node scripts/patch-glue.mjs pkg

      - name: Pack tarball
        run: npm pack ./pkg --pack-destination .

      # Release before npm publish: a failed release can be deleted and re-run,
      # a published npm version cannot.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" ./*.tgz \
            --title "$GITHUB_REF_NAME" --generate-notes $prerelease

      # Trusted publishing needs npm >= 11.5.1 (bundled with Node 24).
      # No registry-url / NODE_AUTH_TOKEN: npm authenticates via OIDC.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Publish to npm
        working-directory: pkg
        run: |
          tag=""
          case "$GITHUB_REF_NAME" in *-*) tag="--tag next" ;; esac
          npm publish --access public $tag
